services:
  - type: web
    name: resumesh-public-backend
    runtime: docker
    dockerContext: ./
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
