services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRE_URL=postgresql://postgres:postgres@db:5432/resumesh
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB_NAME=resumesh
      - LLM_PROVIDER=mock
      - JWT_SECRET_KEY=super-secret-stackecho-key-change-this-in-prod
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
    depends_on:
      db:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
        required: false
    networks:
      - resumesh-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - resumesh-network

  db:
    image: postgres:15-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=resumesh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resumesh-network

  mongo:
    image: mongo:6-jammy
    profiles: ["mongo"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resumesh-network

networks:
  resumesh-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
