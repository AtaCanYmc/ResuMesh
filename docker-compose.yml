services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRE_URL=postgresql://postgres:postgres@db:5432/resumesh
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB_NAME=resumesh
    depends_on:
      db:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
        required: false
    networks:
      - resumesh-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin-backend:
    build:
      context: ./admin/backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./admin/backend/.env
    environment:
      - POSTGRE_URL=postgresql://postgres:postgres@db:5432/resumesh
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB_NAME=resumesh
    depends_on:
      db:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
        required: false
    networks:
      - resumesh-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - resumesh-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin-frontend:
    build:
      context: ./admin/frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - admin-backend
    networks:
      - resumesh-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  db:
    image: postgres:15-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=resumesh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resumesh-network

  mongo:
    image: mongo:6-jammy
    profiles: ["mongo"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resumesh-network

networks:
  resumesh-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
